<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal INC - Mercy 2026</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favico.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mercy-ashen.vercel.app/quiz.html">
    <meta property="og:title" content="Portal INC - Mercy 2026">
    <meta property="og:description"
        content="Masuk ke portal Iseng Ngetest Competition (INC). Siapkan dirimu untuk tantangan seru!">
    <meta property="og:image" content="https://mercy-ashen.vercel.app/assets/images/og-thumb.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://mercy-ashen.vercel.app/quiz.html">
    <meta property="twitter:title" content="Portal INC - Mercy 2026">
    <meta property="twitter:description"
        content="Masuk ke portal Iseng Ngetest Competition (INC). Siapkan dirimu untuk tantangan seru!">
    <meta property="twitter:image" content="https://mercy-ashen.vercel.app/assets/images/og-thumb.png">

<body>

    <!-- Login Section -->
    <div id="quizLogin" class="quiz-overlay">
        <div class="card quiz-login-card">
            <h2 class="text-center mb-2">Login Kompetisi INC</h2>
            <p class="text-center mb-3">Masukkan email yang sudah terdaftar.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Nama Lengkap / Nama Panggilan</label>
                    <input type="text" id="loginName" class="form-input" placeholder="Masukkan nama Anda" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Terdaftar</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="email@contoh.com" required>
                </div>
                <div id="loginMessage" class="mb-2"></div>
                <button type="submit" id="btnLogin" class="btn btn-primary" style="width: 100%;">
                    MULAI KOMPETISI
                </button>
            </form>
            <div class="text-center mt-3"
                style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
                <a href="registration" style="font-size: 0.9rem;">Belum daftar? Daftar di sini</a>
                <a href="/" class="btn btn-secondary btn-sm" style="width: auto; min-width: 150px;">
                    <i class="fas fa-door-open"></i> Kembali ke Home
                </a>
            </div>
        </div>
    </div>

    <!-- Quiz Interface (Hidden initially) -->
    <div id="quizInterface" class="quiz-container hidden">

        <!-- Sidebar Navigation -->
        <aside class="quiz-sidebar" id="quizSidebar">
            <div class="sidebar-header">
                <h3>Soal Quiz</h3>
                <button id="closeSidebar" class="sidebar-close-btn"><i class="fas fa-times"></i></button>
            </div>

            <div class="sidebar-info">
                <div>Terjawab: <span id="answeredCount" class="font-bold">0</span>/30</div>
            </div>

            <div class="question-nav" id="questionNav">
                <!-- Question numbers generated by JS -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="quiz-main">
            <!-- Header -->
            <header class="quiz-header">
                <button id="toggleSidebar" class="sidebar-toggle-btn">
                    <i class="fas fa-bars"></i> Soal
                </button>

                <div class="timer-container">
                    <i class="fas fa-clock"></i>
                    <span id="timerDisplay">60:00</span>
                </div>

                <button id="btnFinish" class="btn btn-primary btn-sm btn-mobile-icon-only">
                    <i class="fas fa-check"></i> <span class="btn-text">Selesai</span>
                </button>
            </header>

            <!-- Question Area -->
            <div class="question-area">
                <div class="question-card">
                    <div class="question-number">No. <span id="currentQNum">1</span></div>
                    <div class="question-text" id="questionText">
                        Loading question...
                    </div>

                    <div class="options-list" id="optionsList">
                        <!-- Options generated by JS -->
                    </div>
                </div>

                <div class="quiz-controls btn-group" style="justify-content: space-between;">
                    <button id="btnPrev" class="btn btn-secondary btn-mobile-icon-only">
                        <i class="fas fa-arrow-left"></i> <span class="btn-text">Sebelumnya</span>
                    </button>
                    <button id="btnNext" class="btn btn-secondary btn-mobile-icon-only">
                        <span class="btn-text">Selanjutnya</span> <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Confirm Submit Modal -->
    <div id="confirmSubmitModal" class="modal"
        style="display: none; align-items: center; justify-content: center; z-index: 6000; background: rgba(0,0,0,0.8);">
        <div class="card text-center" style="max-width: 400px; padding: 2rem; border-radius: 20px;">
            <p style="font-size: 1.125rem; font-weight: 500; margin-bottom: 2rem; color: var(--color-navy);">
                kamu sudah menjawab semua soal, lanjut untuk submit jawaban kamu?
            </p>
            <div class="btn-group" style="justify-content: center; gap: 15px;">
                <button id="btnCancelSubmit" class="btn"
                    style="background: #EF4444; color: white; padding: 0.6rem 1.5rem; border-radius: 8px; border: none; min-width: 100px; cursor: pointer; font-weight: 600;">belum</button>
                <button id="btnConfirmSubmit" class="btn"
                    style="background: #3B82F6; color: white; padding: 0.6rem 1.5rem; border-radius: 8px; border: none; min-width: 100px; cursor: pointer; font-weight: 600;">submit</button>
            </div>
        </div>
    </div>

    <!-- Score Popup Modal -->
    <div id="scoreModal" class="modal"
        style="display: none; align-items: center; justify-content: center; z-index: 5000; background: rgba(0,0,0,0.8); transition: opacity 0.5s ease;">
        <div class="card text-center"
            style="max-width: 400px; padding: 3rem; transform: scale(0.8); transition: transform 0.5s ease; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);">
            <div id="scoreIcon" style="font-size: 5rem; color: #3B82F6; margin-bottom: 1.5rem;">
                <i class="fas fa-trophy"></i>
            </div>
            <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Hasil Kompetisi</h2>
            <p style="color: #64748b; margin-bottom: 2rem;" id="scoreText">Skor iseng ngetest kamu</p>
            <div style="font-size: 4rem; font-weight: 800; color: #1e293b; line-height: 1;" id="finalScoreValue">0</div>
            <p style="margin-top: 1rem; color: #3B82F6; font-weight: 600;">Hebat!</p>
        </div>
    </div>

    <script src="js/quiz.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnFinish = document.getElementById('btnFinish');
            const confirmModal = document.getElementById('confirmSubmitModal');
            const btnCancel = document.getElementById('btnCancelSubmit');
            const btnConfirm = document.getElementById('btnConfirmSubmit');

            if (btnFinish) {
                // Wait for quiz.js to potentially attach its own listeners, then replace the button
                setTimeout(() => {
                    const newBtn = btnFinish.cloneNode(true);
                    btnFinish.parentNode.replaceChild(newBtn, btnFinish);

                    newBtn.addEventListener('click', (e) => {
                        confirmModal.style.display = 'flex';
                    });
                }, 1000);
            }

            btnCancel.addEventListener('click', () => {
                confirmModal.style.display = 'none';
            });

            btnConfirm.addEventListener('click', () => {
                confirmModal.style.display = 'none';
                const originalConfirm = window.confirm;
                window.confirm = () => true; // Bypass internal confirm
                if (typeof finishQuiz === 'function') {
                    finishQuiz();
                }
                setTimeout(() => {
                    window.confirm = originalConfirm;
                }, 1000);
            });
        });
    </script>
</body>

</html>
