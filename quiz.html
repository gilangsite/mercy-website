<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal INC - Mercy 2026</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Login Section -->
    <div id="quizLogin" class="quiz-overlay">
        <div class="card quiz-login-card">
            <h2 class="text-center mb-2">Login Kompetisi INC</h2>
            <p class="text-center mb-3">Masukkan email yang sudah terdaftar.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Terdaftar</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="email@contoh.com" required>
                </div>
                <div id="loginMessage" class="mb-2"></div>
                <button type="submit" id="btnLogin" class="btn btn-primary" style="width: 100%;">
                    MULAI KOMPETISI
                </button>
            </form>
            <div class="text-center mt-2">
                <a href="registration.html" style="font-size: 0.9rem;">Belum daftar? Daftar di sini</a>
            </div>
        </div>
    </div>

    <!-- Quiz Interface (Hidden initially) -->
    <div id="quizInterface" class="quiz-container hidden">

        <!-- Sidebar Navigation -->
        <aside class="quiz-sidebar" id="quizSidebar">
            <div class="sidebar-header">
                <h3>Soal Quiz</h3>
                <button id="closeSidebar" class="sidebar-close-btn"><i class="fas fa-times"></i></button>
            </div>

            <div class="sidebar-info">
                <div>Terjawab: <span id="answeredCount" class="font-bold">0</span>/50</div>
            </div>

            <div class="question-nav" id="questionNav">
                <!-- Question numbers generated by JS -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="quiz-main">
            <!-- Header -->
            <header class="quiz-header">
                <button id="toggleSidebar" class="sidebar-toggle-btn">
                    <i class="fas fa-bars"></i> Soal
                </button>

                <div class="timer-container">
                    <i class="fas fa-clock"></i>
                    <span id="timerDisplay">60:00</span>
                </div>

                <button id="btnFinish" class="btn btn-primary btn-sm">Selesai</button>
            </header>

            <!-- Question Area -->
            <div class="question-area">
                <div class="question-card">
                    <div class="question-number">No. <span id="currentQNum">1</span></div>
                    <div class="question-text" id="questionText">
                        Loading question...
                    </div>

                    <div class="options-list" id="optionsList">
                        <!-- Options generated by JS -->
                    </div>
                </div>

                <div class="quiz-controls">
                    <button id="btnPrev" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Sebelumnya
                    </button>
                    <button id="btnNext" class="btn btn-secondary">
                        Selanjutnya <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="js/quiz.js"></script>
</body>

</html>
